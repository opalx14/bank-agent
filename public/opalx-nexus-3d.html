<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpalX GO — 3-Party Avalanche Nexus Arena</title>
  <style>
    :root {
      --bg: #eef2f7;
      --panel: rgba(255, 255, 255, 0.8);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --border: rgba(15, 23, 42, 0.12);
      --ink: #0b0f19;
      --muted: #475569;
      --avax: #e84142;
      --jade: #10b981;
      --amber: #f59e0b;
      --sky: #0284c7;
      --shadow: 0 18px 42px -18px rgba(11, 15, 25, 0.22);
    }

    :root[data-theme="dark"] {
      --bg: #070b15;
      --panel: rgba(13, 19, 34, 0.72);
      --panel-strong: rgba(13, 19, 34, 0.92);
      --border: rgba(226, 232, 240, 0.14);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --sky: #38bdf8;
      --shadow: 0 22px 54px -16px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #pins-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .arena-pin {
      position: absolute;
      top: 0;
      left: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      color: var(--ink);
      font: 600 12px/1 "Be Vietnam Pro", system-ui, sans-serif;
      letter-spacing: -0.01em;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      white-space: nowrap;
    }

    .arena-pin:hover,
    .arena-pin.is-hovered,
    .arena-pin.is-selected {
      background: var(--panel-strong);
      border-color: rgba(232, 65, 66, 0.58);
      box-shadow: 0 10px 28px -8px rgba(232, 65, 66, 0.35);
    }

    .pin-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .topbar {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .brand-block {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 10px 12px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(145deg, #e84142, #991b1b);
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.04em;
      box-shadow: 0 8px 20px -6px rgba(232, 65, 66, 0.55);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;
      margin-top: 1px;
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-left: auto;
    }

    .pill-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      padding: 8px 13px;
      border-radius: 999px;
      font: 600 12px/1 "Be Vietnam Pro", system-ui, sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: transform 140ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .pill-btn:hover {
      background: var(--panel-strong);
      border-color: rgba(232, 65, 66, 0.48);
    }

    .pill-btn:active {
      transform: scale(0.97);
    }

    .pill-btn.is-primary {
      background: linear-gradient(135deg, #e84142, #c81e24);
      border-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .pill-btn.is-primary:hover {
      filter: brightness(1.07);
    }

    #btn-fullscreen {
      display: none;
    }

    #detail-card {
      position: fixed;
      right: 20px;
      top: 86px;
      width: min(344px, calc(100vw - 40px));
      z-index: 22;
      padding: 18px 18px 16px;
      border-radius: 22px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      pointer-events: none;
      transition: opacity 220ms ease, transform 240ms cubic-bezier(0.2, 0.9, 0.25, 1);
    }

    #detail-card.is-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .detail-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #detail-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #detail-title {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #detail-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    #detail-close {
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    #detail-close:hover {
      color: var(--ink);
      background: rgba(148, 163, 184, 0.14);
    }

    #detail-list {
      margin: 13px 0 15px;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12.5px;
      line-height: 1.48;
      color: var(--ink);
      opacity: 0.92;
    }

    #detail-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      border-radius: 13px;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
      font: 600 12.5px/1 "Be Vietnam Pro", system-ui, sans-serif;
      transition: opacity 150ms ease;
    }

    #detail-cta:hover {
      opacity: 0.9;
    }

    #flow-banner {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translate(-50%, 10px);
      z-index: 20;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--panel-strong);
      border: 1px solid rgba(232, 65, 66, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      max-width: calc(100vw - 24px);
      text-align: center;
    }

    #flow-banner.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      box-shadow: var(--shadow);
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      scrollbar-width: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .bottom-dock::-webkit-scrollbar {
      display: none;
    }

    .dock-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 999px;
      font: 600 12px/1 "Be Vietnam Pro", system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .dock-btn:hover {
      color: var(--ink);
    }

    .dock-btn.is-active {
      background: var(--ink);
      color: var(--bg);
    }

    .dock-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .hint-note {
      position: fixed;
      left: 20px;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 15;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    /* Compact homepage embed mode: strips duplicate header/theme button and maximizes 3D canvas */
    body.is-embed .brand-block,
    body.is-embed #btn-theme,
    body.is-embed #btn-clean,
    body.is-embed .hint-note,
    body.is-embed #detail-card {
      display: none !important;
    }

    body.is-embed #btn-fullscreen {
      display: inline-flex;
    }

    body.is-embed .topbar {
      top: 12px;
      left: 12px;
      right: 12px;
    }

    body.is-embed .bottom-dock {
      bottom: 12px;
      padding: 4px;
    }

    body.is-embed .dock-btn {
      padding: 7px 11px;
      font-size: 11.5px;
    }

    body.is-embed .arena-pin {
      padding: 5px 10px;
      font-size: 11px;
    }

    body.is-embed #flow-banner {
      bottom: 62px;
      font-size: 11.5px;
      padding: 7px 13px;
    }

    body.is-clean .brand-block,
    body.is-clean #btn-play-flow,
    body.is-clean #btn-theme,
    body.is-clean .bottom-dock,
    body.is-clean .hint-note {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .dock-btn { padding: 6px 8.5px; font-size: 11px; gap: 5px; }
      .dock-long { display: none; }
    }

    @media (min-width: 521px) {
      .dock-short { display: none; }
    }

    @media (max-width: 1180px) {
      .hint-note { display: none; }
    }

    @media (max-width: 900px) {
      .brand-sub { display: none; }
      .topbar { left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); }
      .pill-btn { padding: 7px 11px; font-size: 11.5px; }
      #detail-card {
        top: auto;
        bottom: 74px;
        right: 12px;
        left: 12px;
        width: auto;
      }
      #flow-banner { bottom: 68px; font-size: 11px; padding: 7px 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-host" aria-label="OpalX GO 3D Arena with Enterprise, Client, Bank and Avalanche Nexus"></div>
  <div id="pins-layer"></div>

  <header class="topbar">
    <a class="brand-block" href="/" target="_top">
      <div class="brand-mark">OX</div>
      <div>
        <div class="brand-title">OpalX GO — 3-Party 3D Arena</div>
        <div class="brand-sub">Enterprise meets Client &amp; Bank around the Avalanche Nexus</div>
      </div>
    </a>

    <div class="top-actions">
      <button type="button" id="btn-play-flow" class="pill-btn is-primary">Simulate Flow</button>
      <a id="btn-fullscreen" class="pill-btn" href="/opalx-nexus-3d.html" target="_blank" rel="noopener noreferrer" title="Open Fullscreen 3D Arena">Fullscreen</a>
      <button type="button" id="btn-theme" class="pill-btn">Light mode</button>
      <button type="button" id="btn-clean" class="pill-btn">Pure 3D</button>
    </div>
  </header>

  <aside id="detail-card" aria-live="polite">
    <div class="detail-head">
      <div class="detail-title-wrap">
        <span id="detail-dot"></span>
        <h2 id="detail-title">Avalanche Nexus</h2>
      </div>
      <button type="button" id="detail-close" aria-label="Close">×</button>
    </div>
    <p id="detail-sub"></p>
    <ul id="detail-list"></ul>
    <a id="detail-cta" href="/">Open Portal</a>
  </aside>

  <div id="flow-banner"><span id="flow-text"></span></div>

  <nav class="bottom-dock" aria-label="3D camera focus presets">
    <button type="button" class="dock-btn is-active" data-focus="overview">Overview</button>
    <button type="button" class="dock-btn" data-focus="nexus">
      <span class="dock-dot" style="background:#e84142"></span><span class="dock-long">Avalanche Nexus</span><span class="dock-short">Nexus</span>
    </button>
    <button type="button" class="dock-btn" data-focus="enterprise">
      <span class="dock-dot" style="background:#f59e0b"></span>Enterprise
    </button>
    <button type="button" class="dock-btn" data-focus="client">
      <span class="dock-dot" style="background:#10b981"></span>Client
    </button>
    <button type="button" class="dock-btn" data-focus="bank">
      <span class="dock-dot" style="background:#38bdf8"></span>Bank
    </button>
  </nav>

  <div class="hint-note">Drag to orbit 360° · Scroll to zoom</div>
